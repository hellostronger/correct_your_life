# 实盘做T/趋势建议守护线程（2026-10-11）。**只给建议、绝不下单** ——
# 实盘操作始终由本人手动执行；扫描只读行情/日K/持仓，不做任何成交。
# ⚠️ 这是**顶层**段（不是 paper.intervals.t_adv）：调度页
# （DEFAULT_INTERVALS / SCH_INTERVALS / /api/schedule）读写的就是顶层 `t_adv`。
# 本段 enabled 就是「实盘建议」的总开关（页面「⚙️ 调度」里同一个复选框）。
# ⚠️ 与 `paper.t_trading.enabled` **无关**：那个开关管的是**模拟盘**做 T 成交，
# 实盘建议不需要它、也不会因为它开启而成交。趋势减仓/硬止损建议另由
# `paper.t_trading.trend_reduce.enabled` 控制。
t_adv:
  enabled: false
  interval_minutes: 15

# 国际期货盯盘（黄金/白银/WTI/布伦特/天然气/铜，akshare 国际商品实时报价）
# interval_minutes: 抓取周期，0 = 关闭（页面「强制刷新」仍可用）
futures:
  enabled: true
  interval_minutes: 15

# 汇率盯盘（新浪 hq.sinajs.cn 批量报价）
# 在岸/离岸人民币、日元、欧元、港币、英镑；时间列是真实报价时间，不是抓取时间
fx:
  enabled: true
  interval_minutes: 15

# 币圈 24h 趋势参考（gate.io 股票永续；欧易 OKX 本机直连不通，此为平替源）
# 白名单在「自选行情」页的币圈卡片里加删；interval_minutes: 抓价周期，0=关闭
# alert_threshold_pct: |24h 涨跌| 超此值推微信；alert_cooldown_hours: 同向推送冷却
#
# link_* 是「币↔股」关联统计：给每个合约挂一只真实股票，取两侧日K 对齐后算
# 日涨跌相关系数 / beta / 两侧波动率 / 比价偏离。实测 ZHIPU_USDT↔02513 相关 0.85、
# MINIMAX_USDT↔00100 相关 0.88，比价都 ≈7.8（正是 USD/HKD），说明这些永续确实
# 锚定标的股价。link_refresh_hours: 重算周期（与抓价周期解耦）；
# link_lookback_days: 取多少根日K；link_min_overlap: 重叠交易日下限（保证收益样本 >= 8）
# link_alert_dev_pct: 比价偏离中位数超此值(%) 推微信，0=关闭；link_alert_cooldown_hours: 冷却
crypto:
  enabled: true
  interval_minutes: 15
  alert_threshold_pct: 3
  alert_cooldown_hours: 6
  link_enabled: true
  link_refresh_hours: 6
  link_lookback_days: 45
  link_min_overlap: 9
  link_alert_dev_pct: 5
  link_alert_cooldown_hours: 12

# 微信公众号文章监控（wechat_mp.py）
# 微信没有官方接口能读别人公众号的文章，所以本项目不自己爬，只订阅现成开源服务
# （推荐 WeRSS = rachelos/we-mp-rss）的 RSS 产物。根目录 docker-compose.yml 里带了
# `werss` 服务：docker compose --profile werss up -d，然后浏览器开
# http://127.0.0.1:8001/ 用微信读书扫码登录、在里面订阅公众号。
# 网页「📰 公众号」页添加订阅源后，这里控制拉取节奏。
#
# ⚠️ 远程部署（不是本机 8001）几乎一定要配 auth/base_url 这两个键：
#    反代通常会给 /rss 加 Bearer 门槛（不配就是每个源都 401
#    「RSS requires token」，页面上一片红，但 WeRSS 那边文章照常在产出）。
#    token **不在 WeRSS 里**，它在服务器的反代配置里，取法（本项目这台）：
#      ssh root@<服务器>  然后
#      grep -A3 'location /rss' /etc/nginx/conf.d/werss.conf
#    把 `if ($http_authorization != "Bearer xxxx")` 里的 `Bearer xxxx` 整串
#    （含 `Bearer ` 前缀和后面的空格）粘到下面 auth，原样放进请求头。
mp:
  enabled: true
  interval_minutes: 30
  notify_new: true
  max_items: 50
  keep_days: 120
  base_url: ''                # 远程实例填 http://<服务器IP>:8001；本机留空
  auth: ''                    # 'Bearer <token>'，取法见上；纯本机 8001 留空
  # 批量导出 MD / 打印成 PDF（2026-10-20）。正文为空的会先回微信原文页重抓，
  # 重试仍失败则跳过该篇（不中断整次导出），原因写进导出说明。
  export:
    recrawl: true             # 导出时补抓空正文
    retries: 3                # 单篇最多尝试几次（含首次）
    workers: 4                # 补抓并发；别调高，并发越高越容易被微信风控

# X(Twitter) 指定用户发言监控（x_monitor.py + twscrape）
# 需先装依赖：pip install "twscrape[curl]"（curl 后端做浏览器级 TLS 指纹伪装，
# X 会拒绝 httpx 的指纹）。Nitter 已归档下架、snscrape/Twint 随匿名 guest token
# 关闭一起失效，twscrape 是目前唯一可用的开源免费方案。
# 账号 cookie 在网页「🐦 X」页粘贴（x.com → F12 → Application → Cookies 的
# auth_token 与 ct0）。未配账号时本段自动跳过。
x:
  enabled: true
  interval_minutes: 30
  notify_new: true
  max_tweets: 40
  keep_days: 90
  include_retweets: false
  wait_timeout: 25

channels:
  enabled: false            # 默认关：依赖本机 PC 微信 + 管理员权限注入。
                            #   守护线程每 300s 重读本段，所以改这里免重启
                            #   生效（最长 5 分钟）。开启前置条件：
                            #   1) wx_channel 以管理员身份运行（否则注入
                            #      WeChatAppEx.exe 失败，报 administrator
                            #      permission may be required）
                            #   2) 微信里点开视频号页面（status 的 clients > 0）
                            #   3) 用 /api/channels/contact/search?keyword=<昵称>
                            #      拿 v2_ 开头的 username 填进 subscriptions
  api_base: 'http://127.0.0.1:2026'
  api_token: ''              # wx_channel 若设了 X-Local-Auth 才需要
  interval_minutes: 30      # 轮询间隔（分钟），交易时段内
  comments: true            # 是否抓评论（**要求微信页面停在那个视频上**，
                            #   页面 DOM/Store 采集，拿不到会报「客户端未就绪」
                            #   而不是谎报「0 条评论」）
  comment_pages: 1
  max_new_per_sub: 5        # 单个博主单轮最多处理几条新视频
  # 订阅博主：username 是 v2_ 开头的加密 ID，不是昵称。
  # 用 wx_channel 的 /api/channels/contact/search?keyword=<昵称> 查。
  subscriptions: []
  #  - username: 'v2_xxxxxxxxxxxxxxxx'
  #    name: '博主名'
  #    codes: ['600519']      # 关联股票，写进 sa_news_related
  # L2：语音转写（ASR）。**需要先下载 mp4**，当前未接下载器，故默认关。
  # 三种 provider（get_asr 按名字路由）：
  #   xfyun  —— 讯飞语音转写 lfasr。**免费额度最大**（体验包 5 小时/30天，
  #             新用户礼包最高 50 小时/年），中文最准，支持金融垂域 pd=finance。
  #             异步任务制：prepare→upload→merge→轮询→getResult，
  #             task_id 按音频内容 sha1 落盘，重跑不会重复烧额度。
  #             拿凭证：xfyun.cn 注册 → 创建应用 → 添加「语音转写」服务
  #             → 控制台取 app_id + APISecret（32 位）→ 领免费体验包。
  #             APISecret 也可走环境变量 XFYUN_API_SECRET。
  #   auto + Qwen3-Omni-*  —— 硅基多模态，走 /v1/chat/completions，13 tokens/秒
  #   auto + 其它语音模型   —— 硅基 /v1/audio/transcriptions
  asr:
    enabled: false           # 三个 provider 都还没配好凭证，见下面各段
    provider: auto
    # ---- 讯飞（推荐：免费 + 中文最准）----
    app_id: ''                 # 讯飞应用 ID
    api_secret: ''             # 讯飞 APISecret；留空则读环境变量 XFYUN_API_SECRET
    xfyun_base_url: ''        # 留空用官方 https://raasr.xfyun.cn/api
    pd: finance               # 垂域：finance=金融（对财报口播准确率提升明显）
    hot_words: []             # 热词，单个≤16字、最多200个，用 | 分隔
    poll_seconds: 15          # 轮询间隔；官方建议长音频 10 分钟一轮
    max_wait: 900             # 单次同步等待上限；超时后 task_id 已落盘，
                              #   下次调用接着等，不会重复提交
    target_rate: 16000        # 讯飞只收 8k/16k
    # ---- 硅基流动（备用）----
    model: 'Qwen/Qwen3-Omni-30B-A3B-Instruct'
    api_key: ''    # 留空则读环境变量 SILICONFLOW_API_KEY；实测 402 余额不足
    base_url: 'https://api.siliconflow.cn/v1'
    timeout: 300
    # 音频抽取：优先 PyAV(av，已装 14.1.0，自带 FFmpeg 库)，
    # 没有 av 才找 ffmpeg 可执行文件，两者都没有会明确报 asr_no_decoder

# 分析技法学习：从已抓取的公众号文章里萃取「别人用了什么指标、怎么判读」，
# 落 sa_analysis_techniques，注入盘前/盘后报告 prompt。
# 关键设计：人工审核与 AI 自进化是**同一个 status 字段的两端**，不是两套代码。
#   抽取 -> 一律写 pending；ai 模式下 score>=activate_score 的直接转 active，
#          其余留 pending；manual 模式下**全部**留 pending 等人改 status。
#   审核 -> POST /api/analysis/techniques/review {"id":N,"status":"active|rejected"}
# 所以「AI 学歪了」时人一条请求就能止损，不必改代码、不必重启。
analysis_learn:
  enabled: true
  mode: ai                    # ai = AI 自进化（默认）| manual = 人工审核
  activate_score: 7.0         # ai 模式下 >= 这个分直接 active，其余留 pending
  limit: 12                   # 单次注入最多几条（prompt 膨胀会稀释注意力）
  max_chars: 2600             # 注入块总字符上限
  min_chars: 1500             # 正文短于此视为快讯，不花 LLM 调用
  auto_loop: true             # 守护线程定期从新文章萃取
  loop_interval_minutes: 720  # 默认 12h 一轮，每轮最多 3 篇

# 聚宽策略每日结论（2026-10-23）。**只出结论、绝不下单** —— 下单决策仍由 LLM 交易员做。
# 每天 run_time 之后跑一轮：把契约合规的聚宽策略各跑一遍，给出「最后一个交易日实际
# 怎么调仓、折到你的账户是多少股」。结果落 sa_strategy_daily（逐策略结论）+
# sa_strategy_daily_run（轮次台账），页面「🧩 策略库」可看；当天有建议才推通知。
# ⚠️ 这是**顶层**段（不是 paper.*）：调度页（DEFAULT_INTERVALS / /api/schedule）
# 读写的就是顶层 `strategy_daily`。
# ⚠️ enabled 只是「守护线程要不要自己跑」，手动点「试运行」不受它限制。
# 实测一个 486 天窗口的策略跑完约 384 秒（建切片 CSV 15MB + 上传 44MB + 容器回测）。
strategy_daily:
  enabled: true
  min_score: 4               # portable_score 低于此值不进沙箱
  max_strategies: 20         # 每轮最多跑几个（每个约 6 分钟）
  max_codes: 1200            # 切片最多几只股票
  universe_top_n: 600        # 策略要「全市场」时沙箱里只有这个池子（会记 universe_truncated）
  universe_sample_days: 12   # 按最近 N 个交易日成交额中位数排序
  lookback_days: 730         # 回放窗口（自然日），取最后一个交易日的调仓作结论
  min_bars: 250              # 日K不足直接判 insufficient_data
  cash: 1000000.0            # 只影响回放仓位规模，不影响最终折算
  timeout: 600               # 单策略沙箱超时(秒)
  max_stale_days: 45         # 行情滞后超过这个天数判 data_stale，不跑
  run_time: "15:30"          # 每天几点跑（当天已跑过自动跳过；周末不跑）
  interval_minutes: 1440     # 线程检查周期，不是运行周期

# 因子桥（2026-10-26）：把 Vibe-Trading registry 里**能算的**算子直接算到本站
# 日线上，落 sa_factor_run / sa_factor_alpha / sa_factor_code，并注入策略每日
# 结论与盘前/盘后报告。计算由 tools/factor_worker.py 在 Vibe venv 的子进程里完成，
# 主应用不 import 上游。**方向不是硬编码**：用面板自身的样本内 rank IC 定符号。
# 实测：600 只池 + 关注票 ≈ 684 只 × 309 天 × 357 个算子，一轮约 45~130 秒。
# ⚠️ 这里没有 `enabled` 的调度线程；快照由策略每日结论轮次 / 日报生成时按需计算，
# 缓存 cache_minutes 分钟。手动「重算」在「🔬 研究」页。
factor:
  enabled: true
  universe: equity_cn        # 默认面板；snapshot_all 会同时算 A 股与港股
  pool_size: 600             # 按窗口内平均成交额取前 N 只做横截面（关注票总会加入）
  lookback_days: 460         # 计算窗口（自然日），要覆盖最长 warmup 253 根
  min_bars: 200              # 窗口内日线少于这个数的票不进面板
  ic_horizon: 1              # 因子 t 日值 vs t+1 日收益
  ic_min_days: 120           # 样本内 IC 至少这么多个交易日
  ic_min_abs: 0.015          # |IC| 达标才参与定向
  ic_min_ir: 0.15            # |IC_IR| 达标才参与定向
  z_clip: 3.0                # 合成前单算子 z 截断
  align_threshold: 0.25      # 建议同向/相悖的合成 z 门槛
  timeout: 900               # worker 子进程超时(秒)
  cache_minutes: 30          # 同一参数/关注池复用快照的分钟数
  keep_days: 90              # 快照保留天数（更早的轮次级联删除）
  worker_python: ""          # 留空自动找 D:\vibe-trading\.venv 或 /opt/vibe-trading/.venv
  # ---- 港股面板（sa_hk_kline，与 A 股完全分表/分面板，z 不能混算）----
  hk_enabled: true
  hk_pool_size: 100          # 港股样本按窗口内成交额取前 N 只（universe 只有 100 只）
  hk_lookback_days: 365      # 港股夜期短、上市晚，窗口比 A 股短；02513 这类新股也够 120 根
  hk_min_bars: 120           # 港股窗口内少于这个数不进面板
  hk_sync_minutes: 30        # 港股日线增量同步的最小间隔(分钟)
  hk_strong_ratio: 0.20      # 港股置信按「有效算子/可用算子」比例：strong ≥20%
  hk_medium_ratio: 0.10      # 港股 medium ≥10%（A 股仍用绝对 80/40）

