# Stock Advisor 配置模板
# 使用方法：复制为同目录下的 config.yaml 并按需修改（config.yaml 已被 git 忽略，不会提交）
#   cp config.example.yaml config.yaml
# 密钥类配置建议留空，改用环境变量（如 ANTHROPIC_API_KEY），避免明文落盘
#
# 网页「新闻」标签页也可修改以下配置（保存后下一轮抓取生效）

news:
  channels:
    eastmoney: {enabled: true, min_interval: 1.0}
    baidu: {enabled: true, min_interval: 3.0}
    sina: {enabled: true, min_interval: 2.0}
    duckduckgo: {enabled: true, min_interval: 5.0, timeout: 30}
  fetch_interval_minutes: 30
  items_per_query: 10
  keywords_extra: []

# B站UP主动态监听（调 MediaCrawler 抓取，见 bili_monitor.py）
# interval_minutes: 自动抓取周期（分钟），0 = 关闭
# fetch_timeout_minutes: 单轮爬虫子进程超时（分钟）
bili:
  enabled: true
  interval_minutes: 30
  fetch_timeout_minutes: 10

# 微博博主动态监听（调 MediaCrawler 抓取，见 wb_monitor.py）
# interval_minutes: 自动抓取周期（分钟），0 = 关闭；微博风控较严，周期别设太短
wb:
  enabled: true
  interval_minutes: 60
  fetch_timeout_minutes: 15

# 板块轮动监控（sector.py + sector_intraday）
# 盘中：交易时段每 interval_minutes 采样一次全量板块，急拉/涨停骤增即时推微信
# alert_notify: 盘中异动推送开关（盘后轮动预警不受此开关控制，始终推送）
sector:
  enabled: true
  interval_minutes: 5
  alert_notify: true

# 提款计划（app.py _withdrawal_loop）
# 交易日 15:10 起每半小时检查一次达标/临期状态，里程碑（可提/剩10·5·1交易日/逾期）推微信
withdrawal:
  enabled: true

# LLM 提款建议（Anthropic Claude API；api_key 留空则读环境变量 ANTHROPIC_API_KEY）
# enabled=允许网页手动生成；auto_advice=盘后里程碑提醒后自动补一条建议（每日每计划至多一次）
# base_url 留空 = Anthropic 官方端点；使用代理/网关在此填
llm:
  enabled: true
  api_key: ''
  base_url: ''
  model: 'claude-opus-5'
  auto_advice: true

# 财经日历盘前提醒（econ_calendar.py + app.py _calendar_loop）
calendar:
  enabled: true

# 自选股事件告警（alerts.py：限售解禁 + 增发新股上市，东财公开接口）
# 工作日 8:30 后扫一轮，窗口（days 自然日）内的新事件推微信/邮件，同事件只推一次
alerts:
  enabled: true
  days: 14

# 盘中大盘量能监控（app.py _market_volume_loop：三大指数行情量比 f49）
# 交易时段按 interval_minutes 采样；放量/缩量状态翻转（连续两次采样确认）推微信
# notify=false 只看不推；每天最多 4 条、同方向 45 分钟冷却
volume:
  enabled: true
  interval_minutes: 5
  notify: true

# 通知配置（微信走腾讯官方 iLink Bot，凭据存云库；邮件走 SMTP）
# 网页「通知」标签页可改；auth_code 是邮箱授权码，注意保管
notify:
  wx:
    enabled: true
  email:
    smtp_host:
    smtp_port: 0
    from_addr:
    auth_code:
    to_addr:
    enabled: false
