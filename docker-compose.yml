# Stock Advisor 本地一键运行（含 MediaCrawler 抓取能力）
#
# 首次：  git submodule update --init   （MediaCrawler 是 submodule）
# 构建：  docker compose build
# 运行：  docker compose up -d          页面 http://127.0.0.1:8686/
# 扫码：  登录二维码写到 ./mediacrawler-browser/bili_login_qrcode.png，
#         见 README「Docker 运行」一节
#
# ⚠️ 公众号监控的 WeRSS 上游放在 profile 里，默认不启动：
#    docker compose --profile werss up -d
services:
  stock-advisor:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-advisor:latest
    container_name: stock-advisor
    restart: unless-stopped
    ports:
      - "8686:8686"
    env_file:
      - .env            # 只用到 DB_*（云 PostgreSQL）；app.py 启动时解析
    environment:
      UV_BIN: /usr/local/bin/uv
      PYTHONUNBUFFERED: "1"
      # .env 里 DB_HOST 若是 127.0.0.1（宿主机回环），容器内不通，这里覆盖为宿主机；
      # 若 .env 里已是公网/局域网地址，删除本行即可
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # .env 挂载；Dockerfile 里会把它符号链接到 /app/.env（app.py 读 BASE_DIR.parent/.env）
      - ./.env:/correct_your_life/.env:ro
      # stock-advisor 运行数据
      - ./stock-advisor/reports:/app/stock-advisor/reports
      # config.yaml 挂载使网页改配置直接落到宿主文件
      - ./stock-advisor/config.yaml:/app/stock-advisor/config.yaml
      # data/ 放 twscrape 的 X 账号池（x_accounts.db）与各模块状态文件，
      # 丢了要重新扫码/重配，必须持久化
      - ./stock-advisor/data:/app/stock-advisor/data
      # MediaCrawler 运行数据（登录态必须持久化，否则每次重启都要扫码）
      - ./mediacrawler-browser:/srv/MediaCrawler/browser_data
      - ./mediacrawler-data:/srv/MediaCrawler/data

# ⚠️ 微信公众号监控的 WeRSS 服务**不在这里**——它需要长期存活的登录态 + Chromium，
#    天生是独立服务端。已拆到同级的 mp-service/ 目录独立部署：
#        cd mp-service && docker compose up -d
#    本服务只通过 HTTP 拉它的 RSS 产物（地址在 config.yaml 的 mp.base_url
#    或网页「📰 公众号」页配置），两边不共享配置与数据。
